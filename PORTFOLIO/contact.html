  <section class="contact_section layout_padding cool-contact">
    <div class="contact_bg_box">
      <div class="img-box">
        <img src="images/contact-bg.jpg" alt="fond contact">
      </div>
    </div>
    <div class="container">
      <div class="heading_container heading_center">
        <h2 class="contact-title">
          Contactez-moi
        </h2>
      </div>
      <div class="row justify-content-center">
        <div class="col-md-8">
          <form action="#" class="glass-form">
            <div class="contact_form-container">
              <div class="form-group">
                <input type="text" placeholder="Nom complet" required />
              </div>
              <div class="form-group">
                <input type="email" placeholder="Adresse e-mail" required />
              </div>
              <div class="form-group">
                <input type="text" placeholder="Numéro de téléphone" />
              </div>
              <div class="form-group">
                <textarea placeholder="Votre message" rows="5" required></textarea>
              </div>
              <div class="btn-box text-center">
                <button type="submit" class="send-btn">
                  ✉️ Envoyer le message
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
  

  <style>
    .cool-contact {
      position: relative;
      padding: 60px 0;
      background: linear-gradient(to bottom right, #1a1a1a, #333333);
      color: white;
    }
  
    .cool-contact .img-box img {
      width: 100%;
      height: auto;
      object-fit: cover;
      opacity: 0.2;
      filter: blur(5px);
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
  
    .glass-form {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      color: #fff;
      transition: all 0.3s ease-in-out;
    }
  
    .contact-title {
      font-size: 2.5rem;
      margin-bottom: 30px;
      font-weight: bold;
      color: #ffffff;
      z-index: 2;
      position: relative;
    }
  
    .form-group {
      margin-bottom: 20px;
    }
  
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: background 0.3s ease;
    }
  
    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
  
    .form-group input:focus,
    .form-group textarea:focus {
      background: rgba(255, 255, 255, 0.15);
    }
  
    .send-btn {
      background-color: #00bcd4;
      color: #fff;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
  
    .send-btn:hover {
      background-color: #0097a7;
    }
  </style>
